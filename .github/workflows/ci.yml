name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  macos:
    name: Converter + linker (macOS)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r29

      # aapt2 + android.jar for the sample APK (test-apk). The runner image ships the SDK
      # at $ANDROID_HOME; pin the versions so the build does not depend on what is preinstalled.
      - name: Android SDK packages
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --install "build-tools;35.0.0" "platforms;android-35" > /dev/null
          echo "AAPT2=$ANDROID_HOME/build-tools/35.0.0/aapt2" >> "$GITHUB_ENV"
          echo "ANDROID_JAR=$ANDROID_HOME/platforms/android-35/android.jar" >> "$GITHUB_ENV"

      - name: make test
        env:
          NDK_ROOT: ${{ steps.ndk.outputs.ndk-path }}
        run: make test NDK_ROOT="$NDK_ROOT" AAPT2="$AAPT2" ANDROID_JAR="$ANDROID_JAR"

  ios-simulator:
    name: Host app build (iOS Simulator)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r29

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Pick a simulator
        run: |
          SIM=$(xcrun simctl list devices available | grep -m1 -oE 'iPhone [^(]+' | sed 's/ *$//')
          echo "Using simulator: $SIM"
          echo "SIM=$SIM" >> "$GITHUB_ENV"

      - name: Build app
        env:
          NDK_ROOT: ${{ steps.ndk.outputs.ndk-path }}
        run: make app NDK_ROOT="$NDK_ROOT" SIM="$SIM"
